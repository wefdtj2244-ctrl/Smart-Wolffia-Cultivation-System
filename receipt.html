<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Analytics 4 (GA4) -->
  <script src="analytics.js"></script>
  <title>ใบเสร็จรับเงิน - Wave Restaurant</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: var(--bg-tertiary); min-height: 100vh; padding: 1rem 0;">

  <!-- Print Actions bar (hidden during print) -->
  <div class="no-print" style="max-width: 380px; margin: 0 auto; display: flex; gap: 1rem; justify-content: space-between; padding: 0 1rem;">
    <button onclick="window.close()" class="nav-btn" style="border: 1px solid var(--border-color); background-color: var(--bg-secondary); border-radius: var(--radius-md); padding: 0.6rem 1.2rem; font-weight: 600;">
      <i class="fa-solid fa-arrow-left"></i> ปิดหน้าต่าง
    </button>
    <button onclick="window.print()" class="action-btn-block" style="width: auto; padding: 0.6rem 1.5rem;">
      <i class="fa-solid fa-print"></i> พิมพ์ใบเสร็จ
    </button>
  </div>

  <!-- Thermal Receipt Paper Structure -->
  <div class="receipt-paper" id="receipt-paper-content">
    <div style="text-align: center; padding: 2rem 0;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--text-main);"></i>
      <p style="margin-top: 1rem; font-family: sans-serif;">กำลังพิมพ์ใบเสร็จ...</p>
    </div>
  </div>

  <script src="db-config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get("id");

      if (!orderId) {
        document.getElementById("receipt-paper-content").innerHTML = `
          <div class="receipt-header">
            <h3>WAVE RESTAURANT</h3>
            <p>ไม่พบหมายเลขใบเสร็จ</p>
          </div>
        `;
        return;
      }

      try {
        const order = await window.WaveDB.getOrderById(orderId);
        
        if (!order) {
          document.getElementById("receipt-paper-content").innerHTML = `
            <div class="receipt-header">
              <h3>WAVE RESTAURANT</h3>
              <p>ไม่พบออเดอร์หมายเลข ${orderId}</p>
            </div>
          `;
          return;
        }

        renderReceipt(order);

      } catch (err) {
        console.error(err);
        document.getElementById("receipt-paper-content").innerHTML = `
          <div class="receipt-header">
            <h3>ERROR LOADING ORDER</h3>
          </div>
        `;
      }
    });

    function renderReceipt(order) {
      const paper = document.getElementById("receipt-paper-content");
      
      const dateObj = new Date(order.created_at);
      const dateStr = dateObj.toLocaleDateString('th-TH') + ' ' + dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';

      // Generate items rows
      let itemsRowsHtml = "";
      order.items.forEach(it => {
        const itemTotal = it.price * it.qty;
        itemsRowsHtml += `
          <div class="receipt-item-row">
            <span class="receipt-item-name">${it.name}</span>
            <span class="receipt-item-qty">${it.qty}</span>
            <span class="receipt-item-price">฿${itemTotal}</span>
          </div>
        `;
      });

      // Recalculate financial summary details
      const subtotal = order.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const vat = Math.round(subtotal * 0.07);

      paper.innerHTML = `
        <div class="receipt-header">
          <h2 style="font-weight: 800; font-size: 1.4rem; letter-spacing: 0.1em;">WAVE CAFE & REST</h2>
          <p style="font-size: 0.82rem; margin-top: 0.2rem;">123 ถ.สุขุมวิท แขวงคลองเตย เขตคลองเตย กรุงเทพฯ</p>
          <p style="font-size: 0.82rem;">โทร: 02-123-4567 | TAX ID: 0105562000000</p>
        </div>

        <div class="receipt-divider"></div>

        <div class="receipt-row">
          <span>เลขที่ออเดอร์:</span>
          <span>${order.id}</span>
        </div>
        <div class="receipt-row">
          <span>พนักงานขาย:</span>
          <span>Cashier 01</span>
        </div>
        <div class="receipt-row">
          <span>วันที่/เวลา:</span>
          <span>${dateStr}</span>
        </div>
        <div class="receipt-row">
          <span>จุดบริการ/โต๊ะ:</span>
          <span style="font-weight: 800;">โต๊ะ ${order.tableNo}</span>
        </div>
        <div class="receipt-row">
          <span>ชื่อลูกค้า:</span>
          <span>${order.customerName}</span>
        </div>

        <div class="receipt-divider"></div>

        <!-- Items Table Headers -->
        <div class="receipt-item-row" style="font-weight: 700;">
          <span class="receipt-item-name">รายการอาหาร</span>
          <span class="receipt-item-qty">จำนวน</span>
          <span class="receipt-item-price">ยอดรวม</span>
        </div>

        <div class="receipt-divider"></div>

        <!-- Rendered Items list -->
        ${itemsRowsHtml}

        <div class="receipt-divider"></div>

        <div class="receipt-row">
          <span>รวมค่าอาหาร:</span>
          <span>฿${subtotal}</span>
        </div>
        <div class="receipt-row">
          <span>ภาษีมูลค่าเพิ่ม VAT (7%):</span>
          <span>฿${vat}</span>
        </div>
        
        <div class="receipt-divider"></div>

        <div class="receipt-row" style="font-weight: 800; font-size: 1.05rem;">
          <span>ยอดรวมสุทธิ:</span>
          <span>฿${order.total}</span>
        </div>

        <div class="receipt-row">
          <span>ชำระด้วย:</span>
          <span>${order.paymentMethod === 'cash' ? 'เงินสด / Cash' : 'QR Payment'}</span>
        </div>

        <div class="receipt-divider"></div>

        <div class="receipt-footer">
          <p style="font-weight: 700; margin-bottom: 0.3rem;">*** ขอบคุณที่ใช้บริการ ***</p>
          <p>อร่อย สดใหม่ ทุกจานเพื่อคุณ</p>
          <p>WAVE ยินดีต้อนรับทุกท่านเสมอ</p>
        </div>
      `;
    }
  </script>
</body>
</html>
